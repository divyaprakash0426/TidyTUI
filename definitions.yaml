groups:
  # Package caches are cleaned with the package manager's own tool so it can
  # keep what it needs (paccache keeps the two newest versions of each
  # package). A rule with `command:` is skipped when that program is missing.
  - id: "pkg_manager"
    category: "System"
    name: "Package Cache"
    description: "Cached installer files (needs root)"
    rules:
      - os: "arch"
        path: "/var/cache/pacman/pkg/"
        command: "paccache -rk2"
      - os: "ubuntu"
        path: "/var/cache/apt/archives/"
        command: "apt-get clean"
      - os: "debian"
        path: "/var/cache/apt/archives/"
        command: "apt-get clean"
      - os: "fedora"
        path: "/var/cache/dnf/"
        command: "dnf clean packages"
      - os: "opensuse"
        path: "/var/cache/zypp/packages/"
        command: "zypper clean"

  - id: "sys_journal"
    category: "System"
    name: "System Journal"
    description: "systemd logs older than two weeks (needs root)"
    rules:
      - os: "any"
        path: "/var/log/journal"
        command: "journalctl --vacuum-time=2weeks"

  - id: "user_trash"
    category: "System"
    name: "Trash Bin"
    description: "User's deleted files"
    rules:
      - os: "any"
        path: "~/.local/share/Trash/"

  # --- Developer Tools ---
  - id: "dev_npm"
    category: "Developer Tools"
    name: "NPM Cache"
    description: "Node Package Manager cache"
    rules:
      - os: "any"
        path: "~/.npm"

  - id: "dev_pip"
    category: "Developer Tools"
    name: "Pip Cache"
    description: "Python package cache"
    rules:
      - os: "any"
        path: "~/.cache/pip"

  - id: "dev_go"
    category: "Developer Tools"
    name: "Go Build Cache"
    description: "Go build artifacts"
    rules:
      - os: "any"
        path: "~/.cache/go-build"
  
  - id: "dev_pnpm"
    category: "Developer Tools"
    name: "PNPM Store"
    description: "Packages no project references any more"
    rules:
      - os: "any"
        path: "~/.local/share/pnpm/store"
        command: "pnpm store prune"

  - id: "dev_yarn"
    category: "Developer Tools"
    name: "Yarn Cache"
    description: "Yarn global cache"
    rules:
      - os: "any"
        path: "~/.cache/yarn"

  # --- Editors & IDEs ---
  - id: "ide_jetbrains"
    category: "Editors & IDEs"
    name: "JetBrains Cache"
    description: "IntelliJ/PyCharm/WebStorm caches"
    rules:
      - os: "any"
        path: "~/.cache/JetBrains"

  - id: "ide_vscode"
    category: "Editors & IDEs"
    name: "VSCode Cache"
    description: "Visual Studio Code cache"
    rules:
      - os: "any"
        path: "~/.config/Code/Cache"
      - os: "any"
        path: "~/.config/Code/CachedData"

  # --- System & Browsers ---
  - id: "sys_thumbnails"
    category: "System"
    name: "Thumbnail Cache"
    description: "Generated image thumbnails"
    rules:
      - os: "any"
        path: "~/.cache/thumbnails"

  - id: "browser_chrome"
    category: "Browsers"
    name: "Chrome Cache"
    rules:
      - os: "any"
        path: "~/.cache/google-chrome"
  
  - id: "browser_firefox"
    category: "Browsers"
    name: "Firefox Cache"
    rules:
      - os: "any"
        path: "~/.cache/mozilla/firefox"
  
  # --- AI & LLM Tools ---
  - id: "ai_huggingface"
    category: "AI & LLM"
    name: "HuggingFace Cache"
    description: "Model and dataset cache"
    rules:
      - os: "any"
        path: "~/.cache/huggingface"

  - id: "ai_torch"
    category: "AI & LLM"
    name: "PyTorch Cache"
    rules:
      - os: "any"
        path: "~/.cache/torch"

  - id: "ai_claude"
    category: "AI & LLM"
    name: "Claude App Cache"
    rules:
      - os: "any"
        path: "~/.cache/claude"

  # --- Linux Desktop & Window Managers ---
  - id: "desktop_hyprland"
    category: "Desktop"
    name: "Hyprland Cache"
    rules:
      - os: "any"
        path: "~/.cache/hyprland"

  - id: "desktop_rofi"
    category: "Desktop"
    name: "Rofi Cache"
    rules:
      - os: "any"
        path: "~/.cache/rofi-4.runcache"
      - os: "any"
        path: "~/.cache/rofi3.druncache"

  - id: "desktop_wofi"
    category: "Desktop"
    name: "Wofi Cache"
    rules:
      - os: "any"
        path: "~/.cache/wofi-drun"
      - os: "any"
        path: "~/.cache/wofi-dmenu"

  # --- Package Managers (AUR) ---
  - id: "aur_yay"
    category: "AUR Helpers"
    name: "Yay Cache"
    description: "AUR Helper cache (Arch)"
    rules:
      - os: "any"
        path: "~/.cache/yay"

  - id: "aur_paru"
    category: "AUR Helpers"
    name: "Paru Cache"
    description: "AUR Helper cache (Arch)"
    rules:
      - os: "any"
        path: "~/.cache/paru"

  # --- Other Dev Tools ---
  - id: "dev_nvim"
    category: "Editors & IDEs"
    name: "Neovim Cache"
    rules:
      - os: "any"
        path: "~/.cache/nvim"

  - id: "dev_kitty"
    category: "Desktop"
    name: "Kitty Terminal Cache"
    rules:
      - os: "any"
        path: "~/.cache/kitty"

  - id: "dev_docker"
    category: "Developer Tools"
    name: "Docker Cache"
    description: "Requires running docker prune usually, checking common paths"
    rules:
      # This is tricky as root usually owns it, but maybe user has rootless
      - os: "any"
        path: "~/.docker/desktop/cache" 

  - id: "app_discord"
    category: "Apps"
    name: "Discord Cache"
    rules:
      - os: "any"
        path: "~/.config/discord/Cache"
      - os: "any"
        path: "~/.config/discord/Code Cache"

  - id: "app_spotify"
    category: "Apps"
    name: "Spotify Cache"
    rules:
      - os: "any"
        path: "~/.cache/spotify"

  # --- Antigravity ---
  - id: "app_antigravity"
    category: "AI & LLM"
    name: "Antigravity Cache"
    description: "Browser profile caches"
    rules:
      - os: "any"
        path: "~/.gemini/antigravity-browser-profile/Default/Cache"
      - os: "any"
        path: "~/.gemini/antigravity-browser-profile/Default/Code Cache"
      - os: "any"
        path: "~/.gemini/antigravity-browser-profile/ShaderCache"
      - os: "any"
        path: "~/.gemini/antigravity-browser-profile/GrShaderCache"
