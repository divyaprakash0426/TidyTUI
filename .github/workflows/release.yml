name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg rpm

      - name: Install Cargo Tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Build Packages
        run: |
          cargo deb
          cargo generate-rpm

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish || echo "Publish failed (likely already exists), continuing..."

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/TidyTUI
            target/debian/*.deb
            target/generate-rpm/*.rpm
          generate_release_notes: true

  update-aur:
    name: Update AUR
    if: always() # Run even if publish fails or is skipped
    needs: publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Git
        run: pacman -Syu --noconfirm git openssh

      # Fix for "dubious ownership" error in container
      - name: Trust Git Repo
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate .SRCINFO
        id: srcinfo
        run: |
          # The PKGBUILD's pkgver() uses git describe, so fetch full history and
          # all tags. actions/checkout stores the tag ref as its commit, so an
          # annotated tag needs --force or the fetch refuses to "clobber" it.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --prune --unshallow --tags --force
          else
            git fetch --prune --tags --force
          fi

          # Version the AUR commit after the PKGBUILD, not the git ref, so a
          # manual workflow_dispatch from a branch still labels it correctly.
          echo "pkgver=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)" >> "$GITHUB_OUTPUT"
          
          # Fix ownership for builder user
          useradd builder -m
          passwd -d builder
          printf 'builder ALL=(ALL) ALL\n' | tee -a /etc/sudoers
          chown -R builder:builder .
          
          cd packaging/aur
          su builder -c "makepkg --printsrcinfo" > .SRCINFO

      - name: Deploy to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: tidytui-git
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "chore: update to ${{ steps.srcinfo.outputs.pkgver }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
